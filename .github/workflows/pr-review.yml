# Posts every pull request into the private Discord mod channel with a plain-English risk check,
# so mods can react (✅ good / ➖ neutral / ❌ bad), discuss in a thread, and the GitHub manager decides.
# Needs the repo secret DISCORD_WEBHOOK_MODS (the mod channel's webhook URL). Skips quietly if it is not set.
# No AI is used. pull_request_target is used so fork PRs are covered; their code is never checked out or run.
name: pr-review-post
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request and post to the mod channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_MODS }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_USER: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_AVATAR: ${{ github.event.sender.avatar_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_MODS is not set; skipping."; exit 0; fi
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUM/files?per_page=100" | jq -s 'add')
          commits=$(gh api --paginate "repos/$REPO/pulls/$PR_NUM/commits?per_page=100" | jq -s 'add')
          nfiles=$(jq 'length' <<<"$files"); add=$(jq '[.[].additions]|add // 0' <<<"$files"); del=$(jq '[.[].deletions]|add // 0' <<<"$files")
          flags=""; worst=0
          flag() { flags="$flags"$'\n'"$2 $3"; [ "$1" -gt "$worst" ] && worst=$1; return 0; }
          n=$(jq '[.[] | select(.filename | test("^\\.github/"))] | length' <<<"$files")
          [ "$n" -gt 0 ] && flag 3 🔴 "Changes the repo's automation or safety checks (.github). Look closely."
          n=$(jq '[.[] | select(.filename | test("\\.(exe|dll|pak|mbin|png|jpe?g|gif|mp4|mkv|bin|zip|7z|rar|csv|s)$"; "i"))] | length' <<<"$files")
          [ "$n" -gt 0 ] && flag 3 🔴 "Adds files of a type that could be game data, binaries or screenshots ($n file(s))."
          n=$(jq '[.[] | select(.patch == null and .status != "removed")] | length' <<<"$files")
          [ "$n" -gt 0 ] && flag 2 🟠 "$n file(s) GitHub can't show as text (binary or very large)."
          n=$(jq '[.[] | select(.filename | test("^(LICENSE|CONTRIBUTING\\.md|AGENTS\\.md|README\\.md)$"))] | length' <<<"$files")
          [ "$n" -gt 0 ] && flag 2 🟠 "Changes the license, rules or README."
          n=$(jq '[.[] | select((.commit.message | split("\n") | index("Agreed-to: CONTRIBUTING.md#contributor-agreement")) == null)] | length' <<<"$commits")
          [ "$n" -gt 0 ] && flag 3 🔴 "$n commit(s) missing the contributor agreement line. Can't be accepted as is."
          [ "$del" -gt 500 ] && [ "$del" -gt $((add * 2)) ] && flag 1 🟡 "Mostly deletes code ($del lines removed)."
          [ "$nfiles" -gt 50 ] && flag 1 🟡 "Very large change ($nfiles files). Harder to review."
          case $worst in 0) verdict="🟢 Nothing flagged. Normal code change.";; 1) verdict="🟡 Probably fine, worth a look.";; 2) verdict="🟠 Needs a careful look.";; *) verdict="🔴 Don't merge until the red items are explained.";; esac
          [ -z "$flags" ] && flags=$'\n'"🟢 Only ordinary code or text files changed."
          top=$(jq -r 'sort_by(-(.additions+.deletions)) | .[:8][] | "• `\(.filename)` +\(.additions) −\(.deletions) (\(.status))"' <<<"$files")
          case $worst in 0) COLOR=3066993;; 1) COLOR=16776960;; 2) COLOR=15105570;; *) COLOR=15158332;; esac
          TITLE="[$REPO] Pull request $ACTION: #$PR_NUM $PR_TITLE (by $PR_USER)"
          URL=$PR_URL
          DESC=$(printf '**Automatic check:** %s%s\n\n**Size:** %s file(s), +%s −%s\n%s\n\nMods: react ✅ good · ➖ neutral · ❌ bad, discuss in a thread. The GitHub manager makes the final call.' "$verdict" "$flags" "$nfiles" "$add" "$del" "$top")
          jq -n --arg t "${TITLE:0:250}" --arg u "$URL" --arg d "${DESC:0:4000}" --argjson c "$COLOR" --arg an "$SENDER" --arg ai "$SENDER_AVATAR" --arg au "https://github.com/$SENDER" '{username: "GitHub", avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png", allowed_mentions: {parse: []}, embeds: [{author: {name: $an, icon_url: $ai, url: $au}, title: $t, url: $u, description: $d, color: $c}]}' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
