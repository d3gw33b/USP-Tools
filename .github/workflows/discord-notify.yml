# Posts pushes to main and pull request activity into Discord (#github-other-repos), styled like GitHub's cards.
# Needs the repo secret DISCORD_WEBHOOK_OTHER (the channel's webhook URL). Skips quietly if it is not set.
# pull_request_target is used so fork PRs are announced too. It never checks out or runs their code.
name: discord-notify
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]
permissions: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_OTHER }}
          EVENT: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          SENDER_AVATAR: ${{ github.event.sender.avatar_url }}
          REPO: ${{ github.repository }}
          COMPARE: ${{ github.event.compare }}
          COMMITS: ${{ toJSON(github.event.commits) }}
          FORCED: ${{ github.event.forced }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_WEBHOOK_OTHER is not set; skipping."; exit 0; fi
          if [ "$EVENT" = push ]; then
          n=$(jq length <<<"$COMMITS")
          TITLE="[$REPO:main] $n new commit$( [ "$n" = 1 ] || echo s)"
          [ "$FORCED" = true ] && TITLE="$TITLE (force-pushed)"
          URL=$COMPARE
          DESC=$(jq -r --arg r "$REPO" '.[-10:][] | "[`\(.id[0:7])`](https://github.com/\($r)/commit/\(.id)) \(.message | split("\n")[0] | .[0:90]) - \(.author.name)"' <<<"$COMMITS")
          COLOR=$( [ "$FORCED" = true ] && echo 15158332 || echo 7506394 )
          else
            what=opened; COLOR=3066993
            [ "$ACTION" = reopened ] && what=reopened
            [ "$ACTION" = ready_for_review ] && what="ready for review"
            if [ "$ACTION" = closed ]; then
              if [ "$MERGED" = true ]; then what=merged; COLOR=7291585; else what=closed; COLOR=9807270; fi
            fi
            TITLE="[$REPO] Pull request $what: #$PR_NUM $PR_TITLE"
            URL=$PR_URL
            DESC=""; if [ "$ACTION" = opened ]; then DESC=${PR_BODY:0:300}; fi
          fi
          jq -n --arg t "${TITLE:0:250}" --arg u "$URL" --arg d "${DESC:0:4000}" --argjson c "$COLOR" --arg an "$SENDER" --arg ai "$SENDER_AVATAR" --arg au "https://github.com/$SENDER" '{username: "GitHub", avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png", allowed_mentions: {parse: []}, embeds: [{author: {name: $an, icon_url: $ai, url: $au}, title: $t, url: $u, description: $d, color: $c}]}' | curl -fsS -H "Content-Type: application/json" -d @- "$WEBHOOK"
