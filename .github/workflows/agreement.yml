name: contributor-agreement
on: [push, pull_request]
jobs:
  contributor-agreement:
    name: contributor-agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit must carry the agreement line
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            range="${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          bad=0
          for c in $(git rev-list "$range"); do
            if ! git log -1 --format=%B "$c" | grep -qx 'Agreed-to: CONTRIBUTING.md#contributor-agreement'; then
              echo "::error::Commit $c is missing the line: Agreed-to: CONTRIBUTING.md#contributor-agreement"; bad=1
            fi
          done
          exit $bad
